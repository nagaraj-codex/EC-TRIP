name: QueueCut Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queuecut-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run Backend Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}
        run: |
          python apps/api/tests/unit/test_api.py

  frontend-build:
    name: Frontend Typecheck & Build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./apps/web

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile TypeScript & Vite PWA Bundle
        run: npm run build

  system-health-audit:
    name: Full System Health & Integrity Audit
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    timeout-minutes: 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./apps/web/package-lock.json

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          cd apps/web && npm ci

      - name: Execute Full System Health Verification Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}
        run: |
          python verify_system_health.py

      - name: Validate Parks Database Compiler
        run: |
          python scripts/compile_parks_database.py
