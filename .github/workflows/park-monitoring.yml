name: Daily Park Source Monitoring

on:
  schedule:
    # 04:00 UTC daily (09:30 AM IST, before park opening)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: park-source-monitoring
  cancel-in-progress: false

jobs:
  monitor-parks:
    name: Verify Park Websites & Official Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Park Monitoring Verification
        run: node scripts/monitor-parks.mjs

      - name: Upload Monitoring Status Artifact
        uses: actions/upload-artifact@v4
        with:
          name: park-source-status
          path: data/monitoring/
          retention-days: 30

      - name: Commit Monitoring Updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/monitoring/
          if git diff --staged --quiet; then
            echo "No changes in monitored park status."
          else
            git commit -m "chore(monitoring): update daily park official source status [skip ci]"
            git push
          fi
