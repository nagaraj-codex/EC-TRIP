name: Weather Data Refresh

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  refresh-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Weather Refresh Script
        env:
          PYTHONPATH: apps/api
        run: |
          python -c "import asyncio; from app.services.weather.weather import fetch_weather_now, update_weather_cache; async def run(): data = await fetch_weather_now(); update_weather_cache(data, cache_dir='data/interim/cleaned_weather_cache'); asyncio.run(run())"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/interim/cleaned_weather_cache/weather-now.json
          git commit -m "chore(data): refresh weather-now.json [skip ci]" || echo "No changes to commit"
          git push
