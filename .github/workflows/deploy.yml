name: QueueCut Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

  workflow_call:
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      RENDER_DEPLOY_HOOK_URL:
        required: false
      BACKEND_HEALTHCHECK_URL:
        required: false

permissions:
  contents: read

concurrency:
  group: queuecut-production-deployment
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate Vercel Configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured."
              exit 1
            fi
          done

          if [[ ! -f package.json ]]; then
            echo "::error::apps/web/package.json not found."
            exit 1
          fi

          if [[ ! -f package-lock.json ]]; then
            echo "::error::apps/web/package-lock.json not found."
            exit 1
          fi

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Checks
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const p = require("./package.json");
            console.log("Available scripts:", Object.keys(p.scripts || {}).join(", "));
          '
          npm run test:run
          npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Production Configuration
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Build Production Deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Frontend to Production
        shell: bash
        run: |
          set -euo pipefail

          DEPLOYMENT_URL="$(vercel deploy \
            --prebuilt \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN")"

          if [[ -z "$DEPLOYMENT_URL" ]]; then
            echo "::error::Vercel did not return a deployment URL."
            exit 1
          fi

          echo "Frontend deployment completed."
          echo "Deployment URL: $DEPLOYMENT_URL"

  deploy-backend:
    name: Deploy Spring Boot Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      BACKEND_HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit Tests
        working-directory: ./apps/api
        run: ./mvnw clean test

      - name: Check Backend Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            echo "Backend deployment skipped: Render hook is not configured."
            echo "backend_status=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "Render deployment hook is configured."
            echo "backend_status=configured" >> "$GITHUB_OUTPUT"
          fi
        id: config

      - name: Trigger Render Deployment
        if: steps.config.outputs.backend_status == 'configured'
        shell: bash
        run: |
          set -euo pipefail

          HTTP_STATUS="$(curl \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 30 \
            --request POST \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$RENDER_DEPLOY_HOOK_URL")"

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Render deployment request failed with HTTP $HTTP_STATUS."
            exit 1
          fi

          echo "Render deployment trigger accepted."

      - name: Verify Backend Health
        if: steps.config.outputs.backend_status == 'configured' && env.BACKEND_HEALTHCHECK_URL != ''
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            HTTP_CODE="$(curl \
              --silent \
              --max-time 10 \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$BACKEND_HEALTHCHECK_URL" || true)"

            if [[ "$HTTP_CODE" =~ ^[0-9]{3}$ ]] &&
               [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 400 ]]; then
              echo "Backend health check passed with HTTP $HTTP_CODE."
              exit 0
            fi

            echo "Health check attempt $attempt/12 failed; waiting 10 seconds."
            sleep 10
          done

          echo "::error::Backend health check failed after 12 attempts."
          exit 1

      - name: Report Missing Health Check
        if: steps.config.outputs.backend_status == 'configured' && env.BACKEND_HEALTHCHECK_URL == ''
        run: echo "WARNING: Backend deployment triggered, but no health-check URL is configured."

  deployment-summary:
    name: Production Deployment Summary
    runs-on: ubuntu-latest
    timeout-minutes: 2

    needs:
      - deploy-frontend
      - deploy-backend

    if: always()

    steps:
      - name: Generate Deployment Summary
        shell: bash
        env:
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
          BACKEND_RESULT: ${{ needs.deploy-backend.result }}
        run: |
          {
            echo "# QueueCut Production Deployment"
            echo
            echo "## Frontend"
            echo "Status: $FRONTEND_RESULT"
            echo
            echo "## Backend"
            echo "Status: $BACKEND_RESULT"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Deployment Success
        shell: bash
        env:
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
          BACKEND_RESULT: ${{ needs.deploy-backend.result }}
        run: |
          set -euo pipefail

          if [[ "$FRONTEND_RESULT" != "success" ]]; then
            echo "::error::Frontend deployment did not succeed."
            exit 1
          fi

          if [[ "$BACKEND_RESULT" != "success" ]]; then
            echo "::error::Backend deployment did not complete successfully."
            exit 1
          fi

          echo "All required deployment jobs completed successfully."
