# Test profile — uses separate SQLite DB per test run
spring.datasource.url=jdbc:sqlite:./queuecut-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Use default port 0 (random) for tests
server.port=0

# Disable security password logging in tests
logging.level.org.springframework.security=ERROR
logging.level.com.queuecut=WARN

# Test CORS
app.cors.origins=http://localhost:5173

# Test auth (no secure cookies in test env)
app.auth.cookie-secure=false
app.auth.cookie-samesite=lax
app.auth.session-days=1

# Disable Google OAuth for tests
app.google.client-id=
app.google.client-secret=
app.google.redirect-uri=http://localhost:8080/api/v1/auth/google/callback

# Disable external APIs for unit tests (fail-safe)
app.gemini.api-key=
app.resend.api-key=

# Parks catalog path
app.catalog.path=../../data/parks_database/unified_parks_catalog.json
