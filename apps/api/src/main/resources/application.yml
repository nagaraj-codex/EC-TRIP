spring:
  application:
    name: queuecut-api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:./data/queuecut.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: "PRAGMA foreign_keys = ON; PRAGMA journal_mode = WAL;"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  cache:
    type: caffeine
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  osrm-url: https://router.project-osrm.org/route/v1/driving/
  nager-url: https://date.nager.at/api/v3/PublicHolidays
  sunrise-sunset-url: https://api.sunrise-sunset.org/v2
  catalog-path: ./data/parks_database/unified_parks_catalog.json
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  auth:
    cookie-name: queuecut_session
    cookie-secure: ${APP_COOKIE_SECURE:false}
    cookie-samesite: Lax
    session-days: 7
    session-ttl: 7d
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  resend:
    api-key: ${RESEND_API_KEY:}
  open-meteo:
    forecast-url: https://api.open-meteo.com/v1/forecast
    air-quality-url: https://air-quality-api.open-meteo.com/v1/air-quality
  intelligence:
    open-meteo-base-url: https://api.open-meteo.com
    nager-base-url: https://date.nager.at
    http-timeout: 4s
    cache-ttl-weather: 30m
    cache-ttl-holidays: 24h
  telemetry:
    broadcast-interval: 15s
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
