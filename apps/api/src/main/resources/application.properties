# QueueCut Intelligence API - Spring Boot Configuration
spring.application.name=QueueCut Intelligence API

# Database - SQLite default (override with DATABASE_URL env var for PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:./queuecut.db}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=${PORT:8000}

# CORS
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Auth Cookie
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-samesite=${AUTH_COOKIE_SAMESITE:lax}
app.auth.session-days=7

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8000/api/v1/auth/google/callback}

# External API keys
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${LLM_MODEL:gemini-2.5-flash}
app.resend.api-key=${RESEND_API_KEY:}
app.weather.api-key=${WEATHER_API_KEY:}
app.mapbox.token=${MAPBOX_ACCESS_TOKEN:}
app.tomtom.api-key=${TOMTOM_API_KEY:}

# External URLs (no auth required)
app.open-meteo.forecast-url=https://api.open-meteo.com/v1/forecast
app.open-meteo.air-quality-url=https://air-quality-api.open-meteo.com/v1/air-quality
app.sunrise-sunset.url=https://api.sunrise-sunset.org/v2
app.osrm.url=https://router.project-osrm.org/route/v1/driving/
app.nager.url=https://date.nager.at/api/v3/PublicHolidays
app.catalog.path=${CATALOG_PATH:./data/parks_database/unified_parks_catalog.json}

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs

# Logging
logging.level.com.queuecut=INFO
logging.level.org.springframework.security=WARN